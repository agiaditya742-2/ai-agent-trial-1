# config/settings.yaml

# This file contains the central configuration for the AI Agent system.
# By modifying this file, you can change the agent's behavior, add new agents,
# and adjust its personality without altering the source code.

# --- Agent Configurations ---
# Defines the sub-agents that the AgentManager should load.
# Each key is the agent's name, used for routing in the CoreAgent.
# 'module' is the Python module path.
# 'class' is the class name within that module.
agent_configs:
  chat_agent:
    module: "agents.chat_agent"
    class: "ChatAgent"
  voice_agent:
    module: "agents.voice_agent"
    class: "VoiceAgent"
  tool_agent:
    module: "agents.tool_agent"
    class: "ToolAgent"
  task_agent:
    module: "agents.task_agent"
    class: "TaskAgent"

# --- Memory Storage Paths ---
# Specifies the locations for the JSON files used for memory.
# These paths are relative to the project's root directory.
memory_store_paths:
  short_term: "memory_store/short_term.json"
  long_term: "memory_store/long_term.json"

# --- Personality Rules ---
# Controls the agent's communication style and standard responses.
personality_rules:
  # The active personality profile. Can be "friendly", "formal", etc.
  active_profile: "friendly"

  profiles:
    friendly:
      style_prefix: "AI Assistant: "
      standard_responses:
        greeting: "Hey there! I'm your friendly AI assistant. What can I do for you today?"
        farewell: "Catch you later! Have a great day."
        confirmation: "Got it!"

    formal:
      style_prefix: "AI Protocol Unit: "
      standard_responses:
        greeting: "Greetings. I am the AI Protocol Unit, ready to assist. Please state your query."
        farewell: "Mission complete. Terminating session."
        confirmation: "Acknowledged."

# --- AI Model Placeholders ---
# This section is for configuring connections to external AI models.
# In a real implementation, you would put your API keys and model names here.
# For now, they are placeholders.
ai_models:
  # Example for OpenAI
  openai:
    api_key: "YOUR_OPENAI_API_KEY_HERE"
    default_model: "gpt-4"
  # Example for Google Gemini
  gemini:
    api_key: "YOUR_GEMINI_API_KEY_HERE"
    default_model: "gemini-pro"
  # Example for Anthropic Claude
  claude:
    api_key: "YOUR_CLAUDE_API_KEY_HERE"
    default_model: "claude-2"

# --- Tool-Specific Settings ---
# If any tools required API keys or other settings, they would go here.
tool_settings:
  weather_api:
    api_key: "YOUR_WEATHER_API_KEY"
    base_url: "https://api.weather.com/v1/"
  news_api:
    api_key: "YOUR_NEWS_API_KEY"
    base_url: "https://api.news.com/v2/"
