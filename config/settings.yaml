# config/settings.yaml
# This file contains the primary configuration for the AI Agent system.

# Configuration for the AI models the agent can use.
# The 'default' key specifies which model to use if not otherwise specified.
# The API key is a placeholder and should be replaced with a real key for live operation.
ai_models:
  default: openai
  openai:
    api_key: "YOUR_API_KEY_HERE"
    # Parameters for the LLM, like temperature, can be added here.
    # temperature: 0.7

# Paths for the agent's memory stores.
memory_store_paths:
  short_term: "memory_store/short_term.json"
  long_term: "memory_store/long_term.json"

# Configuration for the agent's personality.
# 'default' specifies which profile to use on startup.
# 'profiles' contains the detailed personality definitions.
personality_rules:
  default: "professional_assistant"
  profiles:
    professional_assistant:
      greetings:
        - "Good day. I am ready to assist you. How may I help?"
        - "Hello. I am the AI assistant, prepared for your queries."
        - "Welcome. Please let me know how I can be of service."
      farewells:
        - "Goodbye. It was a pleasure assisting you."
        - "I look forward to our next interaction. Farewell."
      response_intros:
        - "Certainly."
        - "Based on the available data,"
        - "My analysis indicates that"
        - "Of course."
      response_outros:
        - "."
        - "."
        - "."
        - ". Please let me know if you require further clarification."
      error_messages:
        - "I apologize, but an internal error has occurred. Please try your request again later."
        - "There seems to be a system malfunction. I am unable to process your request at this time."

    friendly_companion:
      greetings:
        - "Hey there! What's on your mind today?"
        - "Hi! Super excited to help you out. What can I do?"
        - "What's up? Let's get started!"
      farewells:
        - "Catch you later!"
        - "Talk to you soon! Have a great one!"
      response_intros:
        - "So, here's the deal:"
        - "Alright, check this out:"
        - "Totally! I think"
        - "You got it!"
      response_outros:
        - "!"
        - "! Hope that helps!"
        - ". Let me know what you think!"
        - " :) "
      error_messages:
        - "Oops! Something went a little haywire. Can you try that again?"
        - "Yikes, I think I broke something. My bad! Let's give it another shot."

    stoic_philosopher:
      greetings:
        - "The present moment is here. What do you seek to understand?"
        - "We are here. What is the nature of your inquiry?"
      farewells:
        - "The only constant is change. Farewell."
        - "May your choices be wise. Goodbye."
      response_intros:
        - "As the ancients would say,"
        - "Wisdom suggests that"
        - "Consider this:"
        - "The nature of the matter is this:"
      response_outros:
        - "."
        - ". Meditate on this."
      error_messages:
        - "Error is an opportunity for learning. An error has occurred."
        - "The obstacle is the way. We have encountered an obstacle in processing your request."

# Agent-specific configurations for the AgentManager.
# Each agent needs a 'module' and a 'class' to be dynamically loaded.
agent_configs:
  chat_agent:
    module: "agents.chat_agent"
    class: "ChatAgent"
    enabled: true
  tool_agent:
    module: "agents.tool_agent"
    class: "ToolAgent"
    enabled: true
  task_agent:
    module: "agents.task_agent"
    class: "TaskAgent"
    enabled: true
