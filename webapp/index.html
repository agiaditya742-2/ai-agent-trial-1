<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent - Beast Mode</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
</head>
<body>
    <!-- Container for the animated background -->
    <div id="animated-bg"></div>

    <!-- Main chat interface -->
    <div id="chat-container">
        <div class="chat-header">
            <h2>AI Agent Assistant</h2>
            <div class="header-controls">
                <div class="autonomous-mode">
                    <label for="autonomous-toggle">Autonomous Mode</label>
                    <label class="switch">
                        <input type="checkbox" id="autonomous-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <!-- Three Dots Menu -->
                <div class="menu-container">
                    <button id="menu-btn"><i class="fas fa-ellipsis-v"></i></button>
                    <div id="menu-dropdown" class="menu-dropdown-content">
                        <a href="#" id="feed-agent-btn">Feed Agent Data</a>
                        <a href="#" id="set-wake-word-btn">Set Wake Word</a>
                    </div>
                </div>
            </div>
        </div>
        <div id="chat-box">
            <!-- Messages will be dynamically inserted here -->
        </div>
        <div id="typing-indicator" class="hidden">
            <span></span><span></span><span></span>
        </div>
        <div id="chat-input-area">
            <button id="upload-btn" title="Upload File for this conversation">
                <i class="fas fa-paperclip"></i>
            </button>
            <input type="file" id="file-input" style="display: none;"/>
            <input type="text" id="user-input" placeholder="Type your message or say your wake word...">
            <div class="deep-thinking-area">
                <input type="checkbox" id="deep-thinking-checkbox" title="Enable Deep Thinking for this message">
                <label for="deep-thinking-checkbox">Deep Think</label>
            </div>
            <button id="send-btn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Modal for Settings (Feed Data / Set Wake Word) -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body">
                <!-- Content will be injected by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Wake Word Listening Indicator -->
    <div id="listening-indicator" class="hidden">
        <div class="listening-orb"></div>
        <p>Listening...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
