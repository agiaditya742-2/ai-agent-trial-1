<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Assistant - Advanced</title>
    <link rel="stylesheet" href="style.css">
    <!-- Adding Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="chat-container">
        <div class="chat-header">
            <h2>AI Agent Assistant</h2>
            <div class="header-controls">
                <div class="autonomous-mode">
                    <label for="autonomous-toggle">Autonomous Mode</label>
                    <label class="switch">
                        <input type="checkbox" id="autonomous-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <button id="clear-btn">Clear</button>
            </div>
        </div>
        <div id="chat-box">
            <!-- Initial greeting will be loaded here -->
        </div>
        <div id="typing-indicator" class="hidden">
            <span></span><span></span><span></span>
        </div>
        <div id="chat-input-area">
            <button id="upload-btn" title="Upload File">
                <i class="fas fa-paperclip"></i>
            </button>
            <input type="file" id="file-input" style="display: none;"/>
            <button id="mic-btn" title="Use Microphone">
                <i class="fas fa-microphone"></i>
            </button>
            <input type="text" id="user-input" placeholder="Type your message, or ask for autonomous help...">
            <div class="deep-thinking-area">
                <input type="checkbox" id="deep-thinking-checkbox" title="Enable Deep Thinking for this message">
                <label for="deep-thinking-checkbox">Deep Think</label>
            </div>
            <button id="send-btn">Send</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
